[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher"
version = "0.1.0"
description = "Studcraft publisher"
requires-python = ">=3.9"
# The single source of truth for runtime pins. Do not add a requirements.txt beside it:
# one existed and was removed, because two copies of the same pins drift silently.
dependencies = [
    # Pinned exactly: a patch release that changes stream compression or object
    # ordering changes the output bytes, which the reproducibility test asserts on.
    "fpdf2==2.8.4",
    # Pinned for the same reason as fpdf2: the web edition's bundle is committed and CI
    # fails on a stale one, so a release that changes how a list or a table is emitted would
    # show up as a diff nobody wrote. CommonMark plus the two extensions the ruleset uses.
    "markdown-it-py==3.0.0",
    # tomllib is stdlib from 3.11; below that we need the backport.
    "tomli==2.2.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Reject an unknown marker or config key rather than ignoring it, for the same reason the
# spec loader rejects unknown keys: a typo that is silently ignored looks exactly like a
# feature that does not work.
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source_pkgs = ["publisher"]
branch = true

[tool.coverage.report]
show_missing = true
# The floor is what the suite actually covered when the gate was added — 92.7% with branch
# coverage on — rounded down, not a number someone liked. It can only be raised. Lowering it
# is a decision to argue for in review, which is the point: see system/testing.md.
#
# Raised from 92 to 93 with the web edition, which the suite covers at 93.9%. Raising it is
# the whole reason the number is allowed to move in one direction: leaving it at 92 would
# have let the new code lose a point of coverage without anything noticing.
fail_under = 93
