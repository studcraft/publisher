name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  quicksheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # `-e .` installs the pinned runtime dependencies from pyproject.toml.
      # There is no requirements.txt: a second copy of those pins would drift.
      - run: pip install -e .
      # --pinned checks out exactly the commit source/studcraft.lock.json records.
      # Cloning a branch instead would drift the moment upstream moves, and the build
      # would then refuse to run against an unpinned tree.
      - name: Restore the ruleset to the pinned commit
        run: python -m publisher.sync --pinned
      # Stage 1: ruleset + spec.toml -> document.json, regenerated in place.
      - run: python -m publisher.quicksheet extract
      # The tracked document is the review surface: a ruleset bump or a spec edit must
      # arrive as a readable diff in the PR, not appear at render time. Regenerating must
      # therefore be a no-op against a correctly committed tree.
      - name: The committed document matches the ruleset it claims to come from
        run: |
          if ! git diff --exit-code -- data/quicksheet_3x3/document.json; then
            echo "::error::data/quicksheet_3x3/document.json is stale. Run 'python -m publisher.quicksheet extract' and commit the result."
            exit 1
          fi
      # Stage 2: document.json -> publish/<name>/v<version>/<name>_<lang>.pdf.
      # Reads nothing but the document.
      - run: python -m publisher.quicksheet render --format pdf
      # The published artefact is committed too, so the same gate applies: regenerating it
      # must be a no-op. This is what keeps "which PDF did we publish for this ruleset
      # version" answerable from the repository alone.
      - name: The committed publication matches the document it comes from
        run: |
          if ! git diff --exit-code -- publish/; then
            echo "::error::publish/ is stale. Run 'python -m publisher.quicksheet render' and commit the result."
            exit 1
          fi
      # Render a second time elsewhere and compare. A determinism regression must fail the
      # pipeline, not be discovered when two people diff outputs that should be identical.
      - run: python -m publisher.quicksheet render --out second/ --format pdf
      - name: Rendering twice gives identical bytes
        run: |
          published=$(find publish -name '*.pdf' | head -1)
          cmp "$published" "second/${published#publish/}"
      - uses: actions/upload-artifact@v4
        with:
          name: quicksheet
          path: publish/

  openspec-branch-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if openspec/changes/ reached main outside a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # An all-zero or unreachable BEFORE means there is no range to inspect
          # (branch creation, or history the runner cannot see). Nothing to judge.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable previous SHA for this push. Skipping."
            exit 0
          fi
          status=0
          # Merge commits carry no changes of their own; judge the commits they bring in.
          for sha in $(git rev-list --no-merges "${BEFORE}..${AFTER}"); do
            if ! git diff-tree --no-commit-id --name-only -r "$sha" | grep -q '^openspec/changes/'; then
              continue
            fi
            # A commit that arrived through a pull request is associated with it,
            # whether the PR was merged, squashed, or rebased.
            if [ -n "$(gh api "repos/${GITHUB_REPOSITORY}/commits/$sha/pulls" --jq '.[].number')" ]; then
              continue
            fi
            echo "::error::commit $sha touches openspec/changes/ but did not come from a pull request. OpenSpec proposals must go through a branch + PR."
            status=1
          done
          exit $status
