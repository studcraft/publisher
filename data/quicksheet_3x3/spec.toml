# The content of the one-page 3v3 quick-play sheet.
#
# Every line names the rule it condenses. The build resolves each `rule` against the pinned
# ruleset and fails if the ID is gone, so this file cannot quietly drift from the rules.
#
# Lines marked `authored = true` are this sheet's scenario definition, which the ruleset
# deliberately leaves open (FLOW-013). They print in italic and without a rule ID, and the
# page footer says what italic means.
#
# An entry takes one of three shapes, chosen by how it is read at a table:
#   `text`     a statement to read
#   `outcome`  a lookup to scan — dice results, thresholds
#   `steps`    a sequence to follow
# A `label` is the word the eye searches for. See ../SPEC-FORMAT.md.
#
# Do not write a line here without reading the rule it cites. Condensing rules by hand
# invents plausible wrong words.

language = "en"
title = "StudCraft — 3v3 Quick Sheet"

[[section]]
id = "scenario"
heading = "The Scenario"

[[section.line]]
authored = true
label = "Warband"
text = "3 minifigures each. 2 or more players."

[[section.line]]
authored = true
label = "Game ends"
text = "when only one warband still has a model on the battlefield."

[[section.line]]
authored = true
label = "Winner"
text = "that warband. No turn limit, no draw."

[[section.line]]
rule = "FLOW-001"
label = "Before Turn 1"
steps = [
    "Agree battlefield size",
    "Agree Deployment Volume (W x D x H in UB)",
    "Build forces",
    "Deploy",
    "Determine Priority",
]

[[section.line]]
rule = "FLOW-013"
text = "A scenario may restrict or extend the rules, never contradict them."

[[section]]
id = "turn"
heading = "The Turn"

[[section.line]]
rule = "FLOW-003"
label = "Priority"
text = "every player rolls 1D6. Highest to lowest is the Activation Order. Reroll ties among the tied players only."

[[section.line]]
rule = "FLOW-003"
label = "Priority holder"
text = "chooses once — activate now keeping their place, or cede and drop to last."

[[section.line]]
rule = "CORE-006"
label = "AP"
text = "exactly 3 per activation, every unit, always."

[[section.line]]
rule = "FLOW-004"
label = "Activation"
text = "once per Turn. Ends when the AP are spent or the player stops."

[[section.line]]
rule = "FLOW-007"
text = "Spend AP in any legal order. Move / Move / Attack is legal, so is Rotate / Move / Attack."

[[section.line]]
rule = "FLOW-002"
text = "Activate one unit at a time down the order, skipping players with none left."

[[section.line]]
rule = "FLOW-009"
label = "End of Turn"
steps = ["Temporary effects", "Scenario effects", "Roll Priority again"]

[[section]]
id = "movement"
heading = "Movement"

[[section.line]]
rule = "INF-002"
label = "Forward"
text = "4 UB (12 studs) — 1 AP"

[[section.line]]
rule = "INF-004"
label = "Backward"
text = "4 UB (12 studs) — 1 AP. Facing unchanged."

[[section.line]]
rule = "INF-003"
label = "Sideways"
text = "3 UB (12 studs) — 1 AP"

[[section.line]]
rule = "INF-005"
label = "Rotate"
text = "any facing — 1 AP. No measuring."

[[section.line]]
rule = "INF-012"
label = "Wounded"
text = "2 UB max in any direction — 6 studs forward or back, 8 sideways."

[[section.line]]
rule = "INF-006"
label = "Obstacles"
outcome = [
    { when = "1-3 layers", then = "cross freely, no extra cost" },
    { when = "4-6 layers", then = "climb, +1 AP per obstacle", rule = "INF-007" },
    { when = "7+ layers", then = "impassable without slope, stair or ramp", rule = "INF-008" },
]

[[section.line]]
rule = "MOVE-007"
text = "No diagonals. Combine legs; each leg is its own action and its own 1 AP."

[[section.line]]
rule = "INF-002"
text = "Each move is measured on its own: 2 AP is two moves of 4 UB, not one of 8."

[[section.line]]
rule = "MOVE-003"
text = "Measure along the direction of travel, from the face of the base that leads."

[[section]]
id = "shooting"
heading = "Shooting"

[[section.line]]
rule = "CBT-001"
label = "Sequence"
steps = [
    "Declare weapon",
    "Declare target",
    "Line of Sight",
    "Range",
    "Roll",
    "Count Impacts",
    "Defender resolves",
]

[[section.line]]
rule = "CBT-001"
label = "Cost"
text = "1 AP per weapon system, however many dice it makes."

[[section.line]]
rule = "WPN-005"
label = "Range"
text = "weapon length x 6. A 4-stud weapon reaches 24 studs; a 6-stud, 36."

[[section.line]]
rule = "WPN-006"
label = "Attack Dice"
text = "1 per functional muzzle. Muzzle size changes strength, never the count."

[[section.line]]
rule = "CBT-005"
label = "Attack Roll"
outcome = [
    { when = "4-6", then = "1 Impact" },
    { when = "1-3", then = "no Impact" },
]

[[section.line]]
rule = "CBT-015"
label = "Wounded attack"
text = "roll 2D6, keep the LOWER, then read it above. Same dice count. Never stacks."

[[section.line]]
rule = "CORE-009"
text = "Line of Sight is physical: if you can see it, you can shoot it."

[[section.line]]
rule = "CBT-002"
text = "Any legally targetable part visible from the attacker's viewpoint is enough."

[[section.line]]
rule = "WPN-002"
text = "A functional muzzle is a visibly round opening. Square pieces are not muzzles."

[[section]]
id = "damage"
heading = "Damage"

[[section.line]]
rule = "DMG-008"
label = "Per Impact"
steps = ["Choose component", "Geometry Check", "Damage Roll", "State change"]

[[section.line]]
rule = "WPN-021"
label = "Strength"
text = "muzzle size x 3. 1x1 = 3, 2x2 = 6, NxN = 3N."

[[section.line]]
rule = "DMG-003"
label = "Resistance"
text = "thinnest material the Impact crosses, in plate layers. Plate 1, brick 3. Empty space counts nothing; walls never add up."

[[section.line]]
rule = "DMG-013"
label = "Geometry Check"
outcome = [
    { when = "Str < Res", then = "Impact stops, no die rolled" },
    { when = "Str >= Res", then = "roll for damage" },
]

[[section.line]]
rule = "DMG-014"
label = "Damage Roll"
outcome = [
    { when = "1-3", then = "state advances one step" },
    { when = "4-6", then = "no effect" },
]

[[section.line]]
rule = "DMG-002"
label = "States"
outcome = [
    { when = "Operational", then = "upright" },
    { when = "Wounded", then = "seated" },
    { when = "Dead", then = "removed" },
]

[[section.line]]
rule = "DMG-002"
text = "Wounded changes only the capability it provides — infantry moves shorter (INF-012), a weapon rolls the Wounded attack (CBT-015). Resistance, Strength and AP costs untouched."
