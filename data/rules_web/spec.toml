# The web edition of the StudCraft ruleset.
#
# This file names the ruleset documents that are published and what they are called on the
# web. It does not name rules: which rules a document holds, what order they come in, and
# what each one says all follow from the ruleset, and a second copy here would drift from it.
#
# `slug` is the segment a document is published under. It defaults to the filename with its
# numeric prefix and extension removed, and is written out explicitly for every document
# because these are public URLs: upstream renumbering `08-vehicles.md` must not move
# `/vehicles/veh-003`, and the only way to promise that is to say the slug here.

title = "StudCraft Rules"
language = "en"

# Empty: English is the primary language and carries no segment of its own. A later
# translation is this same edition with base_path = "es", which is why every published link
# is resolved through it rather than hardcoded to the site root.
base_path = ""

# Where the links to the previous and next page sit: "top", "bottom", "both" or "none".
# "both" suits long reference documentation — a reader who arrived looking one rule up sees
# them without scrolling, and a reader going through in order finds them where they stopped.
pagination = "both"

# Every document hangs from one page, so the site has a single thing called "Rules" rather
# than thirteen top-level entries a visitor has to recognise as a set. It is also what the
# navigation menu hangs from.
[root]
slug = "rules"
title = "Rules"
intro = "The StudCraft ruleset, one page per rule. Each system below indexes its own rules; a rule can be cited and linked by its ID."

